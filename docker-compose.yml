services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gyeongbuk
      POSTGRES_USER: gyeongbuk
      POSTGRES_PASSWORD: gyeongbuk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyeongbuk -d gyeongbuk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  mcp-server:
    build: .
    environment:
      PORT: 8787
      DATABASE_URL: postgresql://gyeongbuk:gyeongbuk@postgres:5432/gyeongbuk
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
