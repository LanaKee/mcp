<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="경상북도 공공데이터를 근거와 함께 탐색하는 MCP 해커톤 데모"
    />
    <title>경북 데이터 나침반</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="hero">
      <div class="hero__inner">
        <p class="eyebrow">GYEONGBUK PUBLIC DATA × MCP</p>
        <h1>경북 데이터 나침반</h1>
        <p class="hero__copy">
          인구·지방세·정책·의회 자료를 연결해 결론과 근거, 출처, 한계를 함께 보여줍니다.
        </p>
        <div class="warning">
          현재 세수·정책·의회 결과는 <strong>데모 샘플</strong>입니다. 공식 자료로
          오인하거나 의사결정에 사용하지 마세요.
        </div>
      </div>
    </header>

    <main>
      <section class="questions" aria-labelledby="questions-title">
        <div>
          <p class="section-label">대표 질문</p>
          <h2 id="questions-title">무엇을 확인할까요?</h2>
        </div>
        <div id="question-list" class="question-grid" aria-live="polite"></div>
      </section>

      <section id="result" class="result" aria-live="polite" hidden>
        <div class="result__header">
          <div>
            <p class="section-label">분석 결과</p>
            <h2 id="result-question"></h2>
          </div>
          <span id="status-badge" class="badge">DEMO SAMPLE</span>
        </div>

        <article class="panel conclusion">
          <h3>결론</h3>
          <p id="conclusion"></p>
        </article>

        <div class="result-grid">
          <article class="panel">
            <h3>근거</h3>
            <div id="evidence"></div>
          </article>
          <article class="panel">
            <h3>출처</h3>
            <div id="sources"></div>
          </article>
        </div>

        <article class="panel limitations">
          <h3>한계 및 확인사항</h3>
          <ul id="limitations"></ul>
        </article>
      </section>

      <section id="empty-state" class="empty-state">
        <p>위 질문을 선택하면 목적별 MCP 도구가 실행됩니다.</p>
      </section>
    </main>

    <footer>
      <p>오픈소스 해커톤 프로토타입 · 모든 샘플 응답은 data_status를 포함합니다.</p>
    </footer>
    <script type="module" src="/app.js"></script>
  </body>
</html>
