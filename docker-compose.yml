services:
  postgres:
    image: postgres:16-alpine
    shm_size: 256mb
    environment:
      POSTGRES_DB: gyeongbuk
      POSTGRES_USER: gyeongbuk
      POSTGRES_PASSWORD: gyeongbuk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyeongbuk -d gyeongbuk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  mcp-server:
    build: .
    environment:
      DATA_REPOSITORY: postgres
      PORT: 8787
      HTTP_HOST: 0.0.0.0
      HTTP_AUTH_MODE: token
      HTTP_AUTH_TOKEN: ${HTTP_AUTH_TOKEN:?Set a strong HTTP_AUTH_TOKEN}
      HTTP_TRUST_PROXY: off
      PG_STATEMENT_TIMEOUT_MS: 8000
      PG_QUERY_TIMEOUT_MS: 10000
      STORAGE_WARN_STALE_RATIO_PERCENT: 25
      STORAGE_WARN_DATABASE_BYTES: 2147483648
      STORAGE_WARN_EMBEDDING_ROWS: 250000
      STORAGE_WARN_EXPIRED_AUDIT_ROWS: 10000
      DATABASE_URL: postgresql://gyeongbuk:gyeongbuk@postgres:5432/gyeongbuk
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8787/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
