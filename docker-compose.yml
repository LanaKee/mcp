services:
  postgres:
    image: postgres:16-alpine
    shm_size: 256mb
    restart: unless-stopped
    environment:
      POSTGRES_DB: gyeongbuk
      POSTGRES_USER: gyeongbuk
      POSTGRES_PASSWORD: gyeongbuk
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gyeongbuk -d gyeongbuk"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  # Runs scripts/ops/backup.sh once on startup and then daily. Backups land
  # in the backup-data volume (mount/back it up externally too — a volume on
  # the same host is not disaster recovery on its own). See
  # docs/CHANGES_OPERATIONAL_RESILIENCE.md for restore instructions.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://gyeongbuk:gyeongbuk@postgres:5432/gyeongbuk
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - backup-data:/backups
      - ./scripts/ops/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint:
      - sh
      - -c
      - "while true; do /usr/local/bin/backup.sh || echo 'backup failed, will retry next cycle' >&2; sleep 86400; done"
    depends_on:
      postgres:
        condition: service_healthy

  # Optional: shared rate-limit store for horizontal scaling. Not started by
  # default `docker compose up`; enable with `--profile scale` once running
  # more than one mcp-server replica behind a load balancer. A single
  # instance works fine without this (falls back to the in-process limiter).
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["scale"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-server:
    build: .
    restart: unless-stopped
    environment:
      DATA_REPOSITORY: postgres
      PORT: 8787
      HTTP_HOST: 0.0.0.0
      HTTP_AUTH_MODE: token
      HTTP_AUTH_TOKEN: ${HTTP_AUTH_TOKEN:?Set a strong HTTP_AUTH_TOKEN}
      HTTP_TRUST_PROXY: off
      MCP_MAX_SESSIONS: 256
      MCP_SESSION_IDLE_MS: 600000
      # Set these to the public hostname/origin once a proxy terminates TLS,
      # otherwise DNS rebinding protection stays off.
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      PG_STATEMENT_TIMEOUT_MS: 8000
      PG_QUERY_TIMEOUT_MS: 10000
      STORAGE_WARN_STALE_RATIO_PERCENT: 25
      STORAGE_WARN_DATABASE_BYTES: 2147483648
      STORAGE_WARN_EMBEDDING_ROWS: 250000
      STORAGE_WARN_EXPIRED_AUDIT_ROWS: 10000
      DATABASE_URL: postgres://gyeongbuk:gyeongbuk@postgres:5432/gyeongbuk
      # 화면(Next.js)은 같은 컨테이너에서 127.0.0.1:3100에 뜨고, 8787이 자기
      # 경로가 아닌 요청을 그리로 넘긴다. SKIP_PROTOTYPE=1이면 띄우지 않고
      # 화면 경로는 404가 된다.
      SKIP_PROTOTYPE: ${SKIP_PROTOTYPE:-}
      PROTOTYPE_PORT: 3100
      # 화면이 답을 만들 때 쓰는 것들. 없으면 화면은 뜨지만 질문에 답하지
      # 못한다. MCP_SERVER_URL은 OpenAI 서버가 직접 붙는 곳이라 반드시
      # 공개 주소여야 한다(컨테이너 안 주소는 소용없다).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      MCP_BASE_URL: http://127.0.0.1:8787
      MCP_AUTH_TOKEN: ${HTTP_AUTH_TOKEN}
      # Set to redis://redis:6379 (and run with --profile scale) once
      # scaling mcp-server to multiple replicas so rate limits are shared
      # instead of being enforced independently per instance.
      REDIS_URL: ${REDIS_URL:-}
    ports:
      - "8787:8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8787/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  backup-data:
